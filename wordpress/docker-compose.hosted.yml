# Modo HOSPEDADO (VM local do palestrante) — WordPress 5.6.2 + wpDiscuz 7.0.4 + /flag
# Uso (dentro da VM, na pasta wordpress/):
#   docker compose -f docker-compose.hosted.yml up -d --build
# Depois publique com um túnel apontando para http://localhost:8080
services:
  db:
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - db_data:/var/lib/mysql          # mantém a config do WP entre reinícios do container web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Faz o WordPress usar SEMPRE o host/protocolo pelo qual foi acessado (inclusive via túnel),
      # evitando redirecionamentos quebrados quando a URL pública muda.
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($_SERVER['HTTP_HOST'])) {
          $scheme = (!empty($_SERVER['HTTP_X_FORWARDED_PROTO'])) ? $_SERVER['HTTP_X_FORWARDED_PROTO']
                   : ((!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off') ? 'https' : 'http');
          define('WP_HOME',    $scheme . '://' . $_SERVER['HTTP_HOST']);
          define('WP_SITEURL', $scheme . '://' . $_SERVER['HTTP_HOST']);
        }

volumes:
  db_data:
