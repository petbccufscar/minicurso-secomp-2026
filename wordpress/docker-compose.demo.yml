# Laboratório LOCAL para o minicurso (WordPress 5.6.2 + wpDiscuz 7.0.4 + /flag)
# Uso (na pasta wordpress/):
#   docker compose -f docker-compose.demo.yml up --build
# Abrir:  http://localhost:8080
services:
  db:
    image: mysql:5.7
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: somewordpress
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    # sem volume: ao derrubar o compose o banco zera (bom para repetir a demo do zero)

  web:
    build:
      context: .
      dockerfile: Dockerfile      # constrói a partir de wordpress:5.6.2 + copia wpdiscuz e /flag
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
